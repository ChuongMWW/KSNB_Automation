<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý user | KSNB Automation</title>
<meta name="robots" content="noindex">
<style>
:root{--blue:#12358f;--blue2:#0a276f;--yellow:#ffd200;--bg:#f3f6fb;--text:#172033;--muted:#667085;--line:#dce3ee;--red:#c62828;--green:#15803d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,#102f84,#0b2568);color:#fff;padding:20px 16px}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;color:#fff;text-decoration:none}
.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--yellow);color:var(--blue);display:grid;place-items:center;font-weight:900}
header a.lnk{color:#dce6ff;text-decoration:none;font-size:14px;margin-left:14px}
h1{font-size:24px;margin:16px 0 0}
main{padding:20px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 8px 26px rgba(18,53,143,.06)}
.card h2{font-size:16px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row > div{flex:1 1 160px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
input,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
textarea{min-height:90px;font-family:Consolas,monospace;font-size:13px}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;font-family:inherit;font-size:13px;white-space:nowrap}
button.sec{background:#eef2fa;color:var(--blue)}
button.danger{background:#fdecec;color:var(--red)}
button:hover{filter:brightness(.95)}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;flex:0 0 auto!important;padding-bottom:9px}
.chk input{width:auto}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
td.act{white-space:nowrap}
td.act button{margin:2px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.on{background:#e7f6ec;color:var(--green)} .off{background:#fdecec;color:var(--red)} .adm{background:#fff6cc;color:#8a6d00}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;max-width:90vw;z-index:9}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <a class="logo" href="/index.html"><div class="logo-mark">KS</div><div>KSNB Automation</div></a>
    <div><a class="lnk" href="/index.html">← Trang chủ</a><a class="lnk" href="/api/logout">Đăng xuất</a></div>
  </div>
  <h1>Quản lý user</h1>
</div></header>
<main class="wrap">
  <div class="card">
    <h2>Thêm user</h2>
    <form class="row" id="addForm">
      <div><label>Mã user *</label><input id="aCode" required></div>
      <div><label>Họ tên</label><input id="aName"></div>
      <div><label>Mật khẩu * (≥ 6 ký tự)</label><input id="aPw" required minlength="6"></div>
      <div class="chk"><input type="checkbox" id="aAdm"><label for="aAdm" style="margin:0;color:var(--text)">Quản trị</label></div>
      <div style="flex:0 0 auto"><button type="submit">+ Thêm</button></div>
    </form>
  </div>
  <div class="card">
    <h2>Thêm nhiều user một lúc</h2>
    <textarea id="bulk" placeholder="Mỗi dòng: Mã user, Họ tên, Mật khẩu&#10;NV001, Nguyễn Văn A, 123456&#10;NV002, Trần Thị B, 123456"></textarea>
    <div class="hint">Có thể copy 3 cột (Mã, Họ tên, Mật khẩu) từ Excel rồi dán vào đây.</div>
    <div style="margin-top:10px"><button id="bulkBtn">Thêm danh sách</button></div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
      <h2 style="margin:0">Danh sách user (<span id="cnt">0</span>)</h2>
      <div style="flex:0 1 260px"><input id="filter" placeholder="Lọc theo mã / tên..."></div>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Mã user</th><th>Họ tên</th><th>Trạng thái</th><th>Đăng nhập gần nhất</th><th>Thao tác</th></tr></thead>
      <tbody id="tb"><tr><td colspan="5">Đang tải...</td></tr></tbody>
    </table></div>
  </div>
</main>
<div id="msg"></div>
<script>
let users = [];
const $ = id => document.getElementById(id);
function toast(t) { const m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(m._t); m._t = setTimeout(() => m.style.display = 'none', 3500); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(method, body, qs = '') {
  const r = await fetch('/api/admin/users' + qs, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/login.html?next=/admin.html'; throw 0; }
  if (r.status === 403) { document.querySelector('main').innerHTML = '<div class="card">Bạn không có quyền quản trị.</div>'; throw 0; }
  if (!r.ok && !d.created) throw new Error(d.error || (d.errors || []).join('; ') || 'Lỗi');
  return d;
}
function fmt(t) { return t ? new Date(t).toLocaleString('vi-VN') : '—'; }
function render() {
  const k = $('filter').value.trim().toLowerCase();
  const list = users.filter(u => !k || (u.code + ' ' + u.full_name).toLowerCase().includes(k));
  $('cnt').textContent = users.length;
  $('tb').innerHTML = list.map(u => `<tr>
    <td><b>${esc(u.code)}</b></td><td>${esc(u.full_name)}</td>
    <td><span class="pill ${u.active ? 'on' : 'off'}">${u.active ? 'Hoạt động' : 'Đã khoá'}</span> ${u.is_admin ? '<span class="pill adm">Quản trị</span>' : ''}</td>
    <td>${fmt(u.last_login)}</td>
    <td class="act">
      <button class="sec" data-a="pw" data-id="${u.id}">Đặt lại MK</button>
      <button class="sec" data-a="name" data-id="${u.id}">Sửa tên</button>
      <button class="sec" data-a="adm" data-id="${u.id}">${u.is_admin ? 'Bỏ QT' : 'Cho QT'}</button>
      <button class="${u.active ? 'danger' : 'sec'}" data-a="lock" data-id="${u.id}">${u.active ? 'Khoá' : 'Mở khoá'}</button>
      <button class="danger" data-a="del" data-id="${u.id}">Xoá</button>
    </td></tr>`).join('') || '<tr><td colspan="5">Không có user</td></tr>';
}
async function load() { users = (await api('GET')).users; render(); }
$('filter').addEventListener('input', render);
$('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const d = await api('POST', { code: $('aCode').value, full_name: $('aName').value, password: $('aPw').value, is_admin: $('aAdm').checked });
    if (d.errors?.length) toast(d.errors.join('; ')); else { toast('Đã thêm ' + d.created.join(', ')); e.target.reset(); }
    load();
  } catch (x) { if (x) toast(x.message); }
});
$('bulkBtn').addEventListener('click', async () => {
  const rows = $('bulk').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(/\t|,|;/).map(s => s.trim());
    return { code: p[0], full_name: p[1] || '', password: p[2] || '' };
  });
  if (!rows.length) return toast('Chưa có dòng nào');
  try {
    const d = await api('POST', { users: rows });
    toast(`Đã thêm ${d.created.length} user` + (d.errors.length ? ` · Lỗi: ${d.errors.join('; ')}` : ''));
    if (d.created.length) $('bulk').value = '';
    load();
  } catch (x) { if (x) toast(x.message); }
});
$('tb').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const u = users.find(x => x.id == b.dataset.id); const a = b.dataset.a;
  try {
    if (a === 'pw') { const p = prompt(`Mật khẩu mới cho ${u.code} (≥ 6 ký tự):`); if (!p) return; await api('PATCH', { id: u.id, password: p }); toast('Đã đặt lại mật khẩu ' + u.code); }
    if (a === 'name') { const n = prompt('Họ tên:', u.full_name); if (n === null) return; await api('PATCH', { id: u.id, full_name: n }); }
    if (a === 'adm') await api('PATCH', { id: u.id, is_admin: !u.is_admin });
    if (a === 'lock') await api('PATCH', { id: u.id, active: !u.active });
    if (a === 'del') { if (!confirm(`Xoá user ${u.code}?`)) return; await api('DELETE', null, '?id=' + u.id); toast('Đã xoá ' + u.code); }
    load();
  } catch (x) { if (x) toast(x.message); }
});
load().catch(x => x && toast(x.message));
</script>
</body>
</html>
